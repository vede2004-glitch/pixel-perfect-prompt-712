name: 1. RSS Scraper (10 min)

on:
  repository_dispatch:
    types: [rss-scraper-trigger]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scraper futtatása
        run: python weboldalparolas.py

      - name: Memória elmentése és Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 0. Ha maradtak volna el nem mentett/ideiglenes fájlok, eldobjuk őket, hogy tiszta legyen a pull
          git reset --hard
          git clean -fd
          
          # 1. Legfrissebb állapot behúzása a távoliról
          git pull origin main --rebase
          
          # 2. Hozzáadjuk a frissen generált JSON fájlokat
          git add erdelyi_hirek_memoria.json erdelyi_hirek_csoportositott.json erdelyi_hirek_archivum.json src/data/news.json src/data/archive.json src/data/news_archive.json

          # 3. Commit és push csak érdemi változás esetén
          if git diff --staged --quiet; then
            echo "ℹ️ Nincs új hír vagy változás a fájlokban, commit és push kihagyva."
          else
            echo "✨ Új hírek találhatók! Frissítés mentése..."
            git commit -m "update: RSS adatok frissítése [skip ci]"
            git push origin main
          fi
